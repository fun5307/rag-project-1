# 교과목2 지식그래프·GraphRAG 실습용 - Neo4j 2026.06 + APOC + GDS
# 실행(WSL 네이티브 docker 권장, Docker Desktop 불필요):
#   cd /mnt/d/2026_Class/en-core/docs/02_지식그래프-GraphRAG설계
#   mkdir -p import
#   docker compose pull
#   docker compose up -d      # 백그라운드 실행 (첫 기동은 플러그인 다운로드로 1~2분)
#   docker compose ps         # 상태 확인 (healthy 될 때까지 대기)
#   docker compose logs --tail=100 neo4j
#   docker compose down       # 중지 (데이터 유지)
#   docker compose down -v    # 중지 + 데이터 삭제
#
# 접속: Browser http://localhost:7474  /  Python(Bolt) bolt://localhost:7687
# 계정: neo4j / graphrag2026
name: graphrag-course

services:
  neo4j:
    image: neo4j:2026.06.0-community   # 2026-08 기준 최신 안정 Community
    container_name: graphrag-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/graphrag2026
      # 플러그인: APOC(유틸리티) + Graph Data Science(중심성·커뮤니티, day33~34)
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
      NEO4J_dbms_security_procedures_allowlist: gds.*,apoc.*
      # 초보 로컬 실습용 메모리(가벼운 데이터 전제)
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"   # Neo4j Browser (웹 UI)
      - "7687:7687"   # Bolt — 파이썬 드라이버 연결 포트
    volumes:
      - neo4j-data:/data       # 데이터 유지 (컨테이너를 내려도 보존)
      - neo4j-plugins:/plugins # 플러그인 최초 다운로드 재사용
      - ./import:/import        # LOAD CSV 용 (day32)
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphrag2026 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

volumes:
  neo4j-data:
  neo4j-plugins: