# day17 pgvector 실습용 - PostgreSQL 17 + pgvector 0.8.6 (2026-08 기준 pgvector 최신)
# 실행(WSL 네이티브 docker 권장, Docker Desktop 불필요):
#   docker compose up -d      # 백그라운드 실행
#   docker compose ps         # 상태 확인
#   docker compose down       # 중지 (데이터 유지)
#   docker compose down -v    # 중지 + 데이터 삭제
#
# 파이썬 접속 문자열:
#   postgresql://postgres:pgvector-demo@127.0.0.1:5432/rag
services:
  db:
    image: pgvector/pgvector:0.8.6-pg17   # pgvector 0.8.6(최신) + PostgreSQL 17
    container_name: pgvector-day17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgvector-demo    # 로컬 수업 전용 (외부 공개 서버에선 비밀 관리 사용)
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
